name: Build and release

on:
  push:
    branches: [26.3-fabric]
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Test release tool
        run: python3 -m unittest discover -s release-tool -v
      - uses: actions/upload-artifact@v4
        with:
          name: randomcraft-fabric-26.3
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: randomcraft-fabric-26.3
          path: dist
      - name: Create release after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          tag="26.3-fabric-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists: $tag"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $tag"
            exit 1
          fi
          gh release create "$tag" dist/*.jar --target "$GITHUB_SHA" \
            --title "RandomCraft ${version} - Minecraft 26.3 (Fabric)" \
            --generate-notes --draft
          if [ "$DRAFT" = "false" ]; then
            gh release edit "$tag" --draft=false --latest=false
          fi

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and package Release Studio
        working-directory: release-tool
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RandomCraft-Release-Studio-Windows
          path: release-tool/dist/*.exe
          if-no-files-found: error
